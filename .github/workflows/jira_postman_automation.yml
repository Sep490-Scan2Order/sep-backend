name: Postman API Smart Testing

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ScanToOrder.Api.IntegrationTest/Postman/**'
      
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Tên file .json hoặc "all"'
        required: true
        default: 'all'
      test_folder:
        description: 'Tên Folder hoặc "all"'
        required: true
        default: 'all'

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra newman-reporter-csv

      # BƯỚC 1: TẠO FILE MÔI TRƯỜNG TỪ SECRETS (PHẢI CHẠY TRƯỚC)
      - name: Create Environment File
        run: |
          echo '{
            "name": "GitHub_Actions_Env",
            "values": [
              { "key": "admin_email", "value": "${{ secrets.ADMIN_EMAIL }}", "enabled": true },
              { "key": "admin_password", "value": "${{ secrets.ADMIN_PASSWORD }}", "enabled": true },
              { "key": "baseUrl", "value": "https://api.scan2order.id.vn", "enabled": true }
            ]
          }' > env_vars.json

      # BƯỚC 2: CHẠY NEWMAN
      - name: Execute Postman Collections
        run: |
          COLLECTION_DIR="ScanToOrder.Api.IntegrationTest/Postman"
          FILE="${{ github.event.inputs.test_scope }}"
          FOLDER="${{ github.event.inputs.test_folder }}"
          
          mkdir -p TestResults

          # Kiểm tra nếu chạy thủ công một file cụ thể
          if [[ "$FILE" != "all" && "$FILE" != "" ]]; then
             if [[ "$FOLDER" != "all" && "$FOLDER" != "" ]]; then
                echo "🚀 Running Folder [$FOLDER] in file [$FILE]"
                newman run "$COLLECTION_DIR/$FILE" -e env_vars.json --folder "$FOLDER" --reporters cli,json,htmlextra,csv --reporter-json-export "TestResults/${FILE}_results.json" --insecure || true
             else
                echo "📂 Running entire file [$FILE]"
                newman run "$COLLECTION_DIR/$FILE" -e env_vars.json --reporters cli,json,htmlextra,csv --reporter-json-export "TestResults/${FILE}_results.json" --insecure || true
             fi
          else
             # Chạy tất cả các file .json trong thư mục nếu là Push hoặc chọn 'all'
             echo "🔄 Running all collections in $COLLECTION_DIR"
             for f in "$COLLECTION_DIR"/*.json; do
                filename=$(basename "$f")
                echo "Testing $filename..."
                newman run "$f" -e env_vars.json --reporters cli,json,htmlextra,csv --reporter-json-export "TestResults/${filename}_results.json" --insecure || true
             done
          fi

      # BƯỚC 3: CẬP NHẬT JIRA
      - name: Dynamic Update Jira
        shell: pwsh
        run: |
          $results = Get-ChildItem "TestResults/*_results.json"
          if ($null -eq $results) { 
            Write-Host "⚠️ No results found to update Jira."
            exit 0 
          }
          foreach ($file in $results) {
              $report = Get-Content $file.FullName -Raw | ConvertFrom-Json
              foreach ($execution in $report.run.executions) {
                  $testName = $execution.item.name
                  if ($testName -match "\[(SCRUM-\d+)\]") {
                      $issueKey = $Matches[1]
                      $failedCount = ($execution.assertions | Where-Object { $_.errorCount -gt 0 }).Count
                      $status = if ($failedCount -eq 0) { "✅ PASS" } else { "❌ FAIL" }
                      $pair = "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}"
                      $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
                      $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      $plainText = "h1. 🤖 POSTMAN REPORT: $testName`n*Kết quả*: $status`n*Chi tiết*: [Xem tại GitHub|$runUrl]`n*API*: https://api.scan2order.io.vn"
                      $jsonBody = @{ body = $plainText } | ConvertTo-Json -Compress
                      curl -X POST "https://fpt-team-cijvpo93.atlassian.net/rest/api/2/issue/$issueKey/comment" `
                        -H "Authorization: Basic $auth" -H "Content-Type: application/json" -d $jsonBody
                  }
              }
          }

      # BƯỚC 4: LƯU BÁO CÁO
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Luôn upload báo cáo kể cả khi test fail
        with:
          name: Professional-Reports
          path: TestResults/
